<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="520" viewBox="0 0 1030 520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
<title id="title">Edge AI Inspector signal path</title>
<desc id="desc">Vibration samples pass through three band-pass filters, are reduced to one energy value S per 128 ms frame, scored as the distance d from eight healthy references, and compared with a calibrated threshold T. A one-time commissioning step on about 4.1 seconds of healthy vibration sets the scale, the references and T.</desc>
<defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3d5566"/></marker></defs>
<rect width="1030" height="520" fill="#ffffff"/>
<text x="20" y="32" font-size="14" font-weight="600" fill="#4f6070" letter-spacing="0.5">MONITORING: every 128 ms frame</text>
<rect x="20" y="50" width="162" height="170" rx="10" fill="#fff6e5" stroke="#c99a3c" stroke-width="1.5"/>
<text x="101" y="76" font-size="15" font-weight="600" fill="#1d2b36" text-anchor="middle">Input</text>
<text x="101" y="100" font-size="13" fill="#4f6070" text-anchor="middle">vibration from one</text>
<text x="101" y="119" font-size="13" fill="#4f6070" text-anchor="middle">accelerometer</text>
<text x="101" y="138" font-size="13" fill="#4f6070" text-anchor="middle">42,000 samples/s</text>
<rect x="220" y="50" width="162" height="170" rx="10" fill="#eef5fb" stroke="#6f97b8" stroke-width="1.5"/>
<text x="301" y="76" font-size="15" font-weight="600" fill="#1d2b36" text-anchor="middle">Band-pass ×3</text>
<text x="301" y="100" font-size="13" fill="#4f6070" text-anchor="middle">2–5, 5–10 and</text>
<text x="301" y="119" font-size="13" fill="#4f6070" text-anchor="middle">10–15 kHz;</text>
<text x="301" y="138" font-size="13" fill="#4f6070" text-anchor="middle">4th-order</text>
<text x="301" y="157" font-size="13" fill="#4f6070" text-anchor="middle">Butterworth</text>
<rect x="420" y="50" width="162" height="170" rx="10" fill="#eef5fb" stroke="#6f97b8" stroke-width="1.5"/>
<text x="501" y="76" font-size="15" font-weight="600" fill="#1d2b36" text-anchor="middle">Frame energy</text>
<text x="501" y="100" font-size="13" fill="#4f6070" text-anchor="middle">mean y² over 5,376</text>
<text x="501" y="119" font-size="13" fill="#4f6070" text-anchor="middle">samples per band,</text>
<text x="501" y="138" font-size="13" fill="#4f6070" text-anchor="middle">÷ filter noise gain</text>
<text x="501" y="157" font-size="13" fill="#4f6070" text-anchor="middle">S = P₁ + P₂ + P₃</text>
<rect x="620" y="50" width="162" height="170" rx="10" fill="#eef5fb" stroke="#6f97b8" stroke-width="1.5"/>
<text x="701" y="76" font-size="15" font-weight="600" fill="#1d2b36" text-anchor="middle">Score</text>
<text x="701" y="100" font-size="13" fill="#4f6070" text-anchor="middle">x = log(S / scale)</text>
<text x="701" y="119" font-size="13" fill="#4f6070" text-anchor="middle">d = min |x − bᵢ|</text>
<text x="701" y="138" font-size="13" fill="#4f6070" text-anchor="middle">over the 8 healthy</text>
<text x="701" y="157" font-size="13" fill="#4f6070" text-anchor="middle">references bᵢ</text>
<rect x="820" y="50" width="200" height="170" rx="10" fill="#fff6e5" stroke="#c99a3c" stroke-width="1.5"/>
<text x="920" y="76" font-size="15" font-weight="600" fill="#1d2b36" text-anchor="middle">Output decision</text>
<text x="920" y="100" font-size="13" fill="#4f6070" text-anchor="middle">anomaly if d &gt; T</text>
<text x="920" y="119" font-size="13" fill="#4f6070" text-anchor="middle">normal if d ≤ T</text>
<text x="920" y="138" font-size="13" fill="#4f6070" text-anchor="middle">abstain if S is unusable</text>
<text x="920" y="157" font-size="13" fill="#4f6070" text-anchor="middle">requires-reference</text>
<text x="920" y="176" font-size="13" fill="#4f6070" text-anchor="middle">requires-recalibration</text>
<path d="M182 112 L218 112" fill="none" stroke="#3d5566" stroke-width="1.8" marker-end="url(#head)"/>
<text x="201" y="102" font-size="13" font-style="italic" fill="#1d2b36" text-anchor="middle">x[n]</text>
<path d="M382 112 L418 112" fill="none" stroke="#3d5566" stroke-width="1.8" marker-end="url(#head)"/>
<text x="401" y="102" font-size="13" font-style="italic" fill="#1d2b36" text-anchor="middle">y₁₋₃</text>
<path d="M582 112 L618 112" fill="none" stroke="#3d5566" stroke-width="1.8" marker-end="url(#head)"/>
<text x="601" y="102" font-size="13" font-style="italic" fill="#1d2b36" text-anchor="middle">S</text>
<path d="M782 112 L818 112" fill="none" stroke="#3d5566" stroke-width="1.8" marker-end="url(#head)"/>
<text x="801" y="102" font-size="13" font-style="italic" fill="#1d2b36" text-anchor="middle">d</text>
<text x="20" y="312" font-size="14" font-weight="600" fill="#4f6070" letter-spacing="0.5">COMMISSIONING: once per installation</text>
<rect x="20" y="330" width="212" height="150" rx="10" fill="#eef7ee" stroke="#6fa36f" stroke-width="1.5"/>
<text x="126" y="356" font-size="15" font-weight="600" fill="#1d2b36" text-anchor="middle">Healthy recording</text>
<text x="126" y="380" font-size="13" fill="#4f6070" text-anchor="middle">about 4.1 s (32 frames),</text>
<text x="126" y="399" font-size="13" fill="#4f6070" text-anchor="middle">confirmed healthy by a</text>
<text x="126" y="418" font-size="13" fill="#4f6070" text-anchor="middle">technician; same filters</text>
<text x="126" y="437" font-size="13" fill="#4f6070" text-anchor="middle">→ S₀ … S₃₁</text>
<rect x="310" y="330" width="230" height="150" rx="10" fill="#eef7ee" stroke="#6fa36f" stroke-width="1.5"/>
<text x="425" y="356" font-size="15" font-weight="600" fill="#1d2b36" text-anchor="middle">Fit: frames 0–15</text>
<text x="425" y="380" font-size="13" fill="#4f6070" text-anchor="middle">scale = median of S₀ … S₁₅</text>
<text x="425" y="399" font-size="13" fill="#4f6070" text-anchor="middle">bᵢ = log(Sₖ / scale) at the</text>
<text x="425" y="418" font-size="13" fill="#4f6070" text-anchor="middle">8 even frames k = 0 … 14</text>
<rect x="600" y="330" width="190" height="150" rx="10" fill="#eef7ee" stroke="#6fa36f" stroke-width="1.5"/>
<text x="695" y="356" font-size="15" font-weight="600" fill="#1d2b36" text-anchor="middle">Calibrate: 16–31</text>
<text x="695" y="380" font-size="13" fill="#4f6070" text-anchor="middle">d under clean, white</text>
<text x="695" y="399" font-size="13" fill="#4f6070" text-anchor="middle">and AR(1) noise (20 dB)</text>
<text x="695" y="418" font-size="13" fill="#4f6070" text-anchor="middle">p95 per condition</text>
<rect x="830" y="330" width="190" height="150" rx="10" fill="#eef7ee" stroke="#6fa36f" stroke-width="1.5"/>
<text x="925" y="356" font-size="15" font-weight="600" fill="#1d2b36" text-anchor="middle">Reference</text>
<text x="925" y="380" font-size="13" fill="#4f6070" text-anchor="middle">T = 1.10 × max p95</text>
<text x="925" y="399" font-size="13" fill="#4f6070" text-anchor="middle">declared device, sensor,</text>
<text x="925" y="418" font-size="13" fill="#4f6070" text-anchor="middle">gain, rate; ≤ 30 days</text>
<text x="925" y="437" font-size="13" fill="#4f6070" text-anchor="middle">SHA-256 of the record</text>
<path d="M232 390 L308 390" fill="none" stroke="#3d5566" stroke-width="1.8" marker-end="url(#head)"/>
<text x="252" y="380" font-size="13" font-style="italic" fill="#1d2b36" text-anchor="middle">S</text>
<path d="M540 390 L598 390" fill="none" stroke="#3d5566" stroke-width="1.8" marker-end="url(#head)"/>
<text x="545" y="380" font-size="13" font-style="italic" fill="#1d2b36" text-anchor="start">bᵢ, scale</text>
<path d="M790 390 L828 390" fill="none" stroke="#3d5566" stroke-width="1.8" marker-end="url(#head)"/>
<text x="810" y="380" font-size="13" font-style="italic" fill="#1d2b36" text-anchor="middle">p95</text>
<path d="M425 330 L425 275 L670 275 L670 222" fill="none" stroke="#3d5566" stroke-width="1.8" marker-end="url(#head)"/>
<text x="437" y="267" font-size="13" font-style="italic" fill="#1d2b36" text-anchor="start">scale, bᵢ</text>
<path d="M925 330 L925 222" fill="none" stroke="#3d5566" stroke-width="1.8" marker-end="url(#head)"/>
<text x="933" y="290" font-size="13" font-style="italic" fill="#1d2b36" text-anchor="start">T, config</text>
<text x="1010" y="506" font-size="12" fill="#4f6070" text-anchor="end">Drawn by docs/draw-architecture.js</text>
</svg>
